<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Pi points</title>
  <style>
    body { margin: 0; height: 2000px; background: #fff; }
    #board { position: absolute; left: 0; top: 0; width: 100%; height: 300px; }
    #field { position: absolute; left: 20px; top: 340px; }
    #info { position: absolute; left: 20px; top: 460px; }
    #fine { position: absolute; left: 950px; top: 340px; margin: 0; font: 6px sans-serif; }
    #log { list-style: none; }
  </style>
</head>
<body>
  <canvas id="board"></canvas>
  <input id="field" aria-label="Note">
  <p id="fine">Fine print: code 4217</p>
  <iframe id="frame" title="Cross-site frame" style="position: absolute; left: 400px; top: 320px; width: 300px; height: 120px; border: 0;"></iframe>
  <div id="info">
    <p id="layout"></p>
    <p id="framed">frame got nothing</p>
    <ul id="log"></ul>
  </div>
  <script>
    const target = { x: 1400, y: 150 };
    const params = new URLSearchParams(location.search);
    const embed = document.getElementById("frame");
    if (params.has("shadow")) document.body.appendChild(document.createElement("div")).attachShadow({ mode: params.get("shadow") }).appendChild(embed);
    const center = element => (box => `${Math.round(box.x + box.width / 2)},${Math.round(box.y + box.height / 2)}`)(element.getBoundingClientRect());
    const draw = () => {
      board.width = board.clientWidth;
      board.height = board.clientHeight;
      const context = board.getContext("2d");
      context.fillStyle = "#c02020";
      context.beginPath();
      context.arc(target.x, target.y, 10, 0, 2 * Math.PI);
      context.fill();
      measure();
    };
    const corner = (element, end) => (box => `${Math.round(end ? box.right : box.x)},${Math.round(end ? box.bottom : box.y)}`)(element.getBoundingClientRect());
    const inFrame = (x, y) => (box => `${Math.round(box.x + x)},${Math.round(box.y + y)}`)(embed.getBoundingClientRect());
    const measure = () => {
      layout.textContent = `viewport ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}; target ${target.x},${target.y}; board ${center(board)}; field ${center(field)}; `
        + `frame ${center(embed)}; framefield ${inFrame(80, 52)}; nested ${inFrame(230, 60)}; finestart ${corner(fine)}; fineend ${corner(fine, true)}; scroll ${scrollX},${scrollY}`;
    };
    draw();
    addEventListener("resize", draw);
    addEventListener("scroll", measure);
    for (const type of ["mousedown", "mouseup", "click", "dblclick", "contextmenu"]) {
      board.addEventListener(type, event => {
        if (type === "contextmenu") event.preventDefault();
        log.appendChild(document.createElement("li")).textContent = `${type} ${["left", "middle", "right"][event.button]} ${event.detail} at ${event.clientX},${event.clientY}`;
      });
    }
    if (params.has("slide")) {
      board.addEventListener("mousemove", event => {
        embed.style.left = `${event.clientX - 150}px`;
        embed.style.top = `${event.clientY + scrollY - 60}px`;
      }, { once: true });
    }
    if (params.has("button")) {
      const button = document.body.appendChild(document.createElement("iframe"));
      for (const [name, value] of [["role", "button"], ["aria-label", "Embed button"], ["style", "position: absolute; left: 750px; top: 320px; width: 120px; height: 100px; border: 0;"]]) button.setAttribute(name, value);
      button.src = `http://${params.get("button")}.test:${location.port}/points-frame.html?nested`;
    }
    if (params.has("forward")) field.addEventListener("focus", () => embed.contentWindow.focus());
    embed.src =`http://${params.get("host") ?? "frame"}.test:${location.port}/points-frame.html?${params.get("frame") ?? ""}`;
    addEventListener("message", event => { if (event.origin !== location.origin) framed.textContent = `frame got ${event.data}`; });
  </script>
</body>
</html>
