<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Pi points frame</title>
  <style>
    html, body { margin: 0; height: 400px; background: #20c050; }
    #field { position: absolute; left: 20px; top: 140px; width: 120px; height: 24px; box-sizing: border-box; }
    #nested { position: absolute; left: 170px; top: 110px; width: 120px; height: 100px; border: 0; }
  </style>
</head>
<body>
  <input id="field" aria-label="Frame note">
  <script>
    if (location.search === "?blank") location.replace("about:blank");
    let clicks = 0;
    if (location.search !== "?nested") document.body.appendChild(Object.assign(document.createElement("iframe"), { id: "nested", title: "Nested frame", src: `http://nested.test:${location.port}/points-frame.html?nested` }));
    scrollTo(0, 100);
    let recorded = false;
    for (const type of ["mousedown", "click", "keydown", "input"]) {
      addEventListener(type, () => {
        if (type === "click") clicks++;
        recorded = true;
        top.postMessage(`${type} in ${location.hostname}; clicks ${clicks}; field "${field.value}"`, "*");
      });
    }
    for (const [type, what] of [["mouseover", "pointer"], ["mousemove", "pointer"], ["wheel", "wheel"]]) {
      addEventListener(type, () => { if (!recorded) top.postMessage(`${what} in ${location.hostname}`, "*"); }, { passive: false });
    }
    if (location.search === "?alert") addEventListener("click", () => alert("Frame alert"));
  </script>
</body>
</html>
