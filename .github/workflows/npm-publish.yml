name: CI and npm publish

on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
    branches: [main, 'integrate/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.diff.outputs.workspaces }}
      subagent: ${{ steps.diff.outputs.subagent }}
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          shared='^(package\.json|tsconfig[^/]*\.json|\.github/workflows/)'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            dirs="${GITHUB_REF_NAME%-v*}"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE...HEAD" | grep -qE "$shared" \
            || git diff -U0 "$BASE...HEAD" -- package-lock.json | grep -E '^[-+] ' | grep -qvE '^[-+] *"version":'; then
            dirs=$(ls packages)
          else
            dirs=$(git diff --name-only "$BASE...HEAD" | sed -nE 's#^packages/([A-Za-z0-9._-]+)/.*#\1#p' | sort -u)
          fi
          workspaces="" subagent=false browser=false
          for dir in $dirs; do
            if [ -f "packages/$dir/package.json" ]; then workspaces="$workspaces --workspace=packages/$dir"; fi
            if [ "$dir" = subagent ]; then subagent=true; fi
            if [ "$dir" = browser ]; then browser=true; fi
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ -z "$workspaces" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match any package under packages/."
            exit 1
          fi
          echo "workspaces=$workspaces" >> "$GITHUB_OUTPUT"
          echo "subagent=$subagent" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "Packages:${workspaces:- none}"

  check:
    needs: changes
    if: needs.changes.outputs.workspaces != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKSPACES: ${{ needs.changes.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: npm ci --ignore-scripts
      - run: npm run check $WORKSPACES
      - run: npm test $WORKSPACES
      - run: npm pack --dry-run --ignore-scripts $WORKSPACES

  subagent-macos:
    needs: changes
    if: needs.changes.outputs.subagent == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: npm ci --ignore-scripts
      - run: npm run check --workspace=@lwlee2608/pi-subagent
      - run: npm test --workspace=@lwlee2608/pi-subagent
        env:
          PI_OFFLINE: "1"

  browser-macos:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check --workspace=@lwlee2608/pi-browser
      - run: npm test --workspace=@lwlee2608/pi-browser

  publish:
    needs: [check, subagent-macos, browser-macos]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-v')
      && needs.check.result == 'success'
      && (needs.subagent-macos.result == 'success' || needs.subagent-macos.result == 'skipped')
      && (needs.browser-macos.result == 'success' || needs.browser-macos.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve package from tag
        id: pkg
        run: |
          dir="packages/${GITHUB_REF_NAME%-v*}"
          if [ ! -f "$dir/package.json" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match any package under packages/."
            exit 1
          fi
          expected="${GITHUB_REF_NAME%-v*}-v$(node -p "require('./$dir/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $dir/package.json version ($expected)."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Check whether version is published
        id: version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const result = spawnSync('npm', ['view', `${name}@${version}`, 'version', '--json'], { encoding: 'utf8' });
          if (result.error) throw result.error;
          if (result.status === 0) {
            console.log(`${name}@${version} already published; skipping`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
          } else {
            // Only a missing version permits publishing; registry failures must fail CI.
            const response = JSON.parse(result.stdout || '{}');
            if (response.error?.code !== 'E404') {
              throw new Error(result.stderr || result.stdout || 'npm view failed');
            }
            console.log(`Publishing ${name}@${version}`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          }
          NODE

      - name: Publish new version
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
