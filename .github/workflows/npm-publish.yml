name: CI and npm publish

on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts --workspaces

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve package from tag
        id: pkg
        run: |
          dir="packages/${GITHUB_REF_NAME%-v*}"
          if [ ! -f "$dir/package.json" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match any package under packages/."
            exit 1
          fi
          expected="${GITHUB_REF_NAME%-v*}-v$(node -p "require('./$dir/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $dir/package.json version ($expected)."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Check whether version is published
        id: version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const result = spawnSync('npm', ['view', `${name}@${version}`, 'version', '--json'], { encoding: 'utf8' });
          if (result.error) throw result.error;
          if (result.status === 0) {
            console.log(`${name}@${version} already published; skipping`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
          } else {
            // Only a missing version permits publishing; registry failures must fail CI.
            const response = JSON.parse(result.stdout || '{}');
            if (response.error?.code !== 'E404') {
              throw new Error(result.stderr || result.stdout || 'npm view failed');
            }
            console.log(`Publishing ${name}@${version}`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          }
          NODE

      - name: Publish new version
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
